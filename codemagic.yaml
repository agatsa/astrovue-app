workflows:

  ios-testflight:
    name: iOS TestFlight — AstroVue
    max_build_duration: 75
    instance_type: mac_mini_m1

    environment:
      # Codemagic auto-fetches the Distribution cert + provisioning profile
      # for com.kundlisutra.astrovue using the ASC API key below.
      # No manual CM_CERTIFICATE or CM_PROVISIONING_PROFILE needed.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kundlisutra.astrovue
      vars:
        BUNDLE_ID: com.kundlisutra.astrovue
        APPLE_TEAM_ID: CQ22L6K4HN
        XCODE_WORKSPACE: ios/AstroVue.xcworkspace
        XCODE_SCHEME: AstroVue
      node: v22.0.0
      xcode: latest

    scripts:

      # ── 1. JS dependencies ────────────────────────────────────────────────────
      - name: Install JS dependencies
        script: npm ci --legacy-peer-deps

      # ── 2. CocoaPods ─────────────────────────────────────────────────────────
      - name: Install CocoaPods
        working_directory: ios
        script: |
          gem install cocoapods --no-document 2>/dev/null || true
          pod install --repo-update

      # ── 3. Set app icon name ──────────────────────────────────────────────────
      - name: Set CFBundleIconName
        script: |
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" \
            ios/AstroVue/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" \
            ios/AstroVue/Info.plist

      # ── 4. Apply auto-fetched provisioning profile ────────────────────────────
      - name: Apply provisioning profile
        script: xcode-project use-profiles

      # ── 5. Build Xcode archive ────────────────────────────────────────────────
      - name: Build Xcode archive
        script: |
          set -o pipefail
          MARKETING_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Version: $MARKETING_VERSION | Build: $BUILD_NUMBER"

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme     "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath /tmp/AstroVue.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee /tmp/xcodebuild.log

          tail -30 /tmp/xcodebuild.log
          if ! grep -q "ARCHIVE SUCCEEDED" /tmp/xcodebuild.log; then
            echo "=== ERRORS ===" && grep "error:" /tmp/xcodebuild.log | head -40
            exit 1
          fi

      # ── 6. Export IPA ─────────────────────────────────────────────────────────
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath /tmp/AstroVue.xcarchive \
            -exportPath  /tmp/ipa \
            -exportOptionsPlist "$CM_EXPORT_OPTIONS_PATH" \
            2>&1 | tee /tmp/export.log
          grep -q "EXPORT FAILED" /tmp/export.log && exit 1 || true

      # ── 7. Upload to TestFlight ───────────────────────────────────────────────
      - name: Upload to TestFlight
        script: |
          IPA=$(find /tmp/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey    "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose \
            2>&1 | tee /tmp/upload.log
          cat /tmp/upload.log
          grep -qi "No errors uploading\|UPLOAD SUCCEEDED" /tmp/upload.log || exit 1

    artifacts:
      - /tmp/ipa/*.ipa
      - /tmp/xcodebuild.log

    publishing:
      email:
        recipients:
          - rahul.amu2@gmail.com
        notify:
          success: true
          failure: true
