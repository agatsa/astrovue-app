workflows:

  ios-testflight:
    name: iOS TestFlight — AstroVue
    max_build_duration: 75
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - ios-signing   # Reuses existing Codemagic group — read-only, Agatsa untouched
      vars:
        XCODE_WORKSPACE:  ios/AstroVue.xcworkspace
        XCODE_SCHEME:     AstroVue
        BUNDLE_ID:        com.kundlisutra.astrovue
        APPLE_TEAM_ID:    CQ22L6K4HN
        SUBMIT_TO_APP_STORE: "false"
      node: v22.0.0
      xcode: latest

    scripts:

      # ── 1. JS dependencies ────────────────────────────────────────────────────
      - name: Install JS dependencies
        script: npm ci --legacy-peer-deps

      # ── 2. CocoaPods ─────────────────────────────────────────────────────────
      - name: Install CocoaPods
        working_directory: ios
        script: |
          gem install cocoapods --no-document 2>/dev/null || true
          pod install --repo-update

      # ── 3. Set CFBundleIconName ───────────────────────────────────────────────
      - name: Set CFBundleIconName
        script: |
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" \
            ios/AstroVue/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" \
            ios/AstroVue/Info.plist

      # ── 4. Import distribution certificate ───────────────────────────────────
      - name: Import distribution certificate
        script: |
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          keychain initialize
          keychain add-certificates --certificate /tmp/cert.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning

      # ── 5. Install provisioning profile ──────────────────────────────────────
      - name: Install provisioning profile
        script: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          TMP=/tmp/profile.mobileprovision
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > "$TMP"
          security cms -D -i "$TMP" > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID"  /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name"  /tmp/profile.plist)
          echo "UUID: $PROFILE_UUID  Name: $PROFILE_NAME"
          cp "$TMP" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV

      # ── 6. Build Xcode archive ────────────────────────────────────────────────
      - name: Build Xcode archive
        script: |
          set -o pipefail
          CM_KEYCHAIN=$(keychain show-info 2>&1 | grep -oE '/[^ ]+\.keychain-db' | head -1)
          [ -n "$CM_KEYCHAIN" ] && security list-keychains -s "$CM_KEYCHAIN" \
            "$HOME/Library/Keychains/login.keychain-db" && \
            security unlock-keychain "$CM_KEYCHAIN" 2>/dev/null || true

          # Version from package.json
          MARKETING_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Version: $MARKETING_VERSION | Build: $BUILD_NUMBER"

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme     "$XCODE_SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath /tmp/AstroVue.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            2>&1 | tee /tmp/xcodebuild.log || true

          tail -30 /tmp/xcodebuild.log
          if ! grep -q "ARCHIVE SUCCEEDED" /tmp/xcodebuild.log; then
            echo "=== ERRORS ===" && grep "error:" /tmp/xcodebuild.log | head -40
            exit 1
          fi

      # ── 7. Export IPA ─────────────────────────────────────────────────────────
      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath /tmp/AstroVue.xcarchive \
            -exportPath  /tmp/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tee /tmp/export.log
          grep -q "EXPORT FAILED" /tmp/export.log && exit 1 || true

      # ── 8. Upload to TestFlight ───────────────────────────────────────────────
      - name: Upload to TestFlight
        script: |
          IPA=$(find /tmp/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey    "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose \
            2>&1 | tee /tmp/upload.log
          cat /tmp/upload.log
          grep -qi "No errors uploading\|UPLOAD SUCCEEDED" /tmp/upload.log || exit 1

    artifacts:
      - /tmp/ipa/*.ipa
      - /tmp/xcodebuild.log

    publishing:
      email:
        recipients:
          - rahul.amu2@gmail.com
        notify:
          success: true
          failure: true
