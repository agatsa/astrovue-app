workflows:

  ios-testflight:
    name: iOS TestFlight — Cosmiq
    max_build_duration: 75
    instance_type: mac_mini_m1

    environment:
      groups:
        - ios-signing
      vars:
        BUNDLE_ID:        com.agatsa.astrovue
        APPLE_TEAM_ID:    LJM8LK8Y2H
        XCODE_WORKSPACE:  ios/AstroVue.xcworkspace
        XCODE_SCHEME:     AstroVue
      node: v22.0.0
      xcode: latest

    scripts:

      - name: Install JS dependencies
        script: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        working_directory: ios
        script: |
          gem install cocoapods --no-document 2>/dev/null || true
          pod install --repo-update

      - name: Patch fmt consteval for Xcode 26
        script: |
          find ios/Pods/fmt -name "*.h" | while IFS= read -r f; do
            sed -i '' 's/# *define FMT_CONSTEVAL consteval/# define FMT_CONSTEVAL constexpr/g' "$f" 2>/dev/null || true
          done
          echo "fmt patch done"

      - name: Set CFBundleIconName
        script: |
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" \
            ios/AstroVue/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" \
            ios/AstroVue/Info.plist

      - name: Import distribution certificate
        script: |
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          echo "p12 size: $(wc -c < /tmp/cert.p12) bytes"
          keychain initialize
          keychain add-certificates --certificate /tmp/cert.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
          echo "Identities available:"
          security find-identity -v -p codesigning

      - name: Install provisioning profile
        script: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          security cms -D -i profiles/AstroVue.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /tmp/profile.plist)
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /tmp/profile.plist)
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile Team: $PROFILE_TEAM"
          cp profiles/AstroVue.mobileprovision "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV

      - name: Build Xcode archive
        script: |
          set -o pipefail
          CM_KEYCHAIN=$(keychain show-info 2>&1 | grep -oE '/[^ ]+\.keychain-db' | head -1)
          if [ -n "$CM_KEYCHAIN" ]; then
            security list-keychains -s "$CM_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
            security unlock-keychain "$CM_KEYCHAIN" 2>/dev/null || true
          fi
          echo "Signing identities:"
          security find-identity -v -p codesigning

          MARKETING_VERSION=$(node -e "console.log(require('./package.json').version)")
          GIT_BUILD=$(git rev-list --count HEAD)
          echo "Version: $MARKETING_VERSION | Build: $GIT_BUILD"

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme     "$XCODE_SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath /tmp/AstroVue.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GIT_BUILD" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            2>&1 | tee /tmp/xcodebuild.log; XCODE_EXIT=${PIPESTATUS[0]}

          tail -30 /tmp/xcodebuild.log
          echo "xcodebuild exit: $XCODE_EXIT"
          if [ $XCODE_EXIT -ne 0 ] || [ ! -d /tmp/AstroVue.xcarchive ]; then
            echo "=== ERRORS ===" && grep -i "error:" /tmp/xcodebuild.log | head -40
            exit 1
          fi
          echo "Archive created successfully!"

      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath /tmp/AstroVue.xcarchive \
            -exportPath  /tmp/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tee /tmp/export.log
          tail -20 /tmp/export.log
          if grep -q "EXPORT FAILED" /tmp/export.log; then exit 1; fi

      - name: Upload to TestFlight
        script: |
          IPA=$(find /tmp/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey    "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose \
            2>&1 | tee /tmp/upload.log
          cat /tmp/upload.log
          grep -qi "No errors uploading\|UPLOAD SUCCEEDED" /tmp/upload.log || exit 1

    artifacts:
      - /tmp/ipa/*.ipa
      - /tmp/xcodebuild.log

    publishing:
      email:
        recipients:
          - rahul.amu2@gmail.com
        notify:
          success: true
          failure: true
